[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recordstore"
version = "0.17.0"
description = "Versioned key-record store over a content-addressed bytes store (memory or Ethereum Swarm/Bee backends)"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["swarm", "ethereum", "web3", "bee", "bzz", "content-addressed", "versioning", "key-value-store", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Archiving",
]
license = { text = "BSD-3-Clause" }

[project.optional-dependencies]
bee = ["requests"]
fsspec = ["fsspec"]
# postage_batch_id="auto", batch_status(), and the expiry/bucket warnings.
# 0.4.0 is the floor: earlier swarmfs has no StampManager.list_batches or
# .buckets, so the inspection path would fail at runtime instead of install.
stamps = ["swarmfs>=0.4.0"]
# local_first_store: needs swarmfs's localstore/localsync modules (0.5.0+)
local = ["swarmfs>=0.5.0"]
swarm-addressing = ["swarmfs[feeds]"]
feeds = ["swarm-bee"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/petfold/recordstore"
Repository = "https://github.com/petfold/recordstore"
Issues = "https://github.com/petfold/recordstore/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
